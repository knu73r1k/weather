
<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Været på MC tur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .weather-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }
        .weather-header h1 {
            font-weight: 300;
            font-size: 1.8rem;
        }
        .weather-header p {
            opacity: 0.85;
            margin-bottom: 0;
        }
        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 1rem;
        }
        .weather-table {
            margin-bottom: 0;
        }
        .weather-table thead th {
            background-color: #e8f0fe;
            border-bottom: 2px solid #1a73e8;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            padding: 0.75rem 0.5rem;
        }
        .weather-table thead th:first-child {
            text-align: left;
            min-width: 110px;
        }
        .weather-table tbody td {
            text-align: center;
            vertical-align: middle;
            padding: 0.5rem;
            font-size: 0.85rem;
        }
        .weather-table tbody td:first-child {
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        .weather-table tbody tr:hover {
            background-color: #f8f9ff;
        }
        .weather-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 100px;
        }
        .weather-cell img {
            width: 38px;
            height: 38px;
        }
        .temp {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .temp-max { color: #d32f2f; }
        .temp-min { color: #1565c0; }
        .temp-separator { color: #999; margin: 0 1px; }
        .precip {
            color: #1a73e8;
            font-size: 0.75rem;
        }
        .precip.dry {
            color: #aaa;
        }
        .day-name {
            display: block;
            font-size: 0.95rem;
        }
        .day-date {
            display: block;
            font-size: 0.75rem;
            color: #666;
            font-weight: 400;
        }
        #loading {
            text-align: center;
            padding: 3rem;
        }
        .spinner-border {
            color: #1a73e8;
        }
        #error {
            display: none;
        }
        #updated-current, #updated-next {
            opacity: 0.7;
            font-size: 0.85rem;
        }
        .attribution {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #777;
        }
        .attribution a {
            color: #1a73e8;
        }
        .places-panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 0.75rem 1rem;
        }
        .places-toggle {
            background: none;
            border: none;
            color: #1a73e8;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.25rem 0;
            cursor: pointer;
        }
        .places-body {
            margin-top: 0.75rem;
        }
        .places-search {
            position: relative;
            max-width: 420px;
        }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #dde3ea;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            margin-top: 2px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 20;
            display: none;
        }
        .search-results.show { display: block; }
        .search-result {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f2f5;
        }
        .search-result:last-child { border-bottom: none; }
        .search-result:hover { background: #f0f4ff; }
        .search-result .sr-name { font-weight: 600; }
        .search-result .sr-meta { color: #777; font-size: 0.8rem; }
        .search-empty { padding: 0.5rem 0.75rem; color: #999; font-size: 0.85rem; }
        .selected-places {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 0.85rem;
        }
        .place-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #e8f0fe;
            color: #0d47a1;
            border-radius: 16px;
            padding: 4px 6px;
            font-size: 0.85rem;
        }
        .chip-label { padding: 0 2px; }
        .place-chip button {
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            line-height: 1;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .chip-move {
            background: #cfe0fb;
            color: #0d47a1;
        }
        .chip-move:hover:not(:disabled) { background: #b6d2f8; }
        .chip-move:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .chip-remove {
            background: #1a73e8;
            color: white;
        }
        .chip-remove:hover { background: #d32f2f; }
        .places-empty { color: #999; font-size: 0.85rem; margin-top: 0.85rem; }
    </style>
</head>
<body>
    <div class="weather-header">
        <div class="container">
            <h1>Været på MC tur</h1>
            <p><span id="updated-current"></span><br><span id="updated-next"></span></p>
        </div>
    </div>

    <div class="container mb-3">
        <div class="places-panel">
            <button id="places-toggle" class="places-toggle" type="button" aria-expanded="false">⚙ Velg steder</button>
            <div id="places-body" class="places-body" style="display: none;">
                <div class="places-search">
                    <input id="place-search" type="text" class="form-control" placeholder="Søk etter sted i Norge…" autocomplete="off">
                    <div id="search-results" class="search-results"></div>
                </div>
                <div id="selected-places" class="selected-places"></div>
            </div>
        </div>
    </div>

    <div class="container mb-4">
        <div class="table-container">
            <div id="loading">
                <div class="spinner-border mb-3" role="status"></div>
                <p>Henter værdata fra Yr...</p>
            </div>
            <div id="error" class="alert alert-danger" role="alert"></div>
            <div id="forecast" style="display: none;">
                <table class="table weather-table" id="weather-table">
                    <thead><tr id="table-header"></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
        <div class="attribution">
            Værdata fra <a href="https://www.yr.no/" target="_blank">Yr</a>,
            levert av <a href="https://www.met.no/" target="_blank">Meteorologisk institutt</a>
        </div>
    </div>

    <script>
        const DEFAULT_LOCATIONS = [
            { name: 'Stavanger',     lat: 58.9700, lon: 5.7314 },
            { name: 'Helleland',     lat: 58.5238, lon: 6.1172 },
            { name: 'Moi',           lat: 58.4614, lon: 6.5511 },
            { name: 'Flekkefjord',   lat: 58.2971, lon: 6.6603 },
            { name: 'Lyngdal',       lat: 58.1376, lon: 7.0700 },
            { name: 'Mandal',        lat: 58.0268, lon: 7.4535 },
            { name: 'Kristiansand',  lat: 58.1467, lon: 7.9956 },
            { name: 'Arendal',       lat: 58.4615, lon: 8.7725 },
            { name: 'Tvedestrand',   lat: 58.6227, lon: 8.9311 },
            { name: 'Kragerø',       lat: 58.8869, lon: 9.3469 },
            { name: 'Sandefjord',    lat: 59.1306, lon: 10.2167 },
            { name: 'Horten',        lat: 59.4208, lon: 10.4328 },
            { name: 'Drammen',       lat: 59.7378, lon: 10.2050 },
            { name: 'Solsetra',      lat: 59.7325, lon: 10.0447 },
        ];

        const PLACES_COOKIE = 'weather_places';
        const COOKIE_MAX_AGE = 60 * 60 * 24 * 365; // 1 year

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return match ? decodeURIComponent(match[1]) : null;
        }
        function setCookie(name, value) {
            document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${COOKIE_MAX_AGE}; path=/; SameSite=Lax`;
        }

        function loadPlaces() {
            const raw = getCookie(PLACES_COOKIE);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.every(p => p && p.name && p.lat != null && p.lon != null)) {
                        return parsed;
                    }
                } catch (e) { /* fall through to defaults */ }
            }
            return DEFAULT_LOCATIONS.map(p => ({ ...p }));
        }
        function savePlaces(list) {
            setCookie(PLACES_COOKIE, JSON.stringify(list));
        }

        // Mutable, cookie-backed list of places shown in the app.
        let LOCATIONS = loadPlaces();

        function cacheKeyFor(location) {
            return `weather_${location.name}_${location.lat}_${location.lon}`;
        }

        const DAY_NAMES = ['Søn', 'Man', 'Tir', 'Ons', 'Tor', 'Fre', 'Lør'];
        const ICON_BASE = 'https://cdn.jsdelivr.net/gh/metno/weathericons@main/weather/svg/';
        const API_BASE = 'https://api.met.no/weatherapi/locationforecast/2.0/compact';
        const USER_AGENT = 'WeatherForecastApp/1.0 knut.hollund@bouvet.no';
        const FALLBACK_TTL_MS = 60 * 60 * 1000; // 1 hour fallback if no Expires header

        function cacheGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function cacheSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        const MIN_FETCH_INTERVAL_MS = 60 * 1000;

        function lastFetchAge() {
            const ts = cacheGet('weather_last_fetch');
            return ts ? Date.now() - parseInt(ts, 10) : Infinity;
        }
        function markFetched() {
            cacheSet('weather_last_fetch', String(Date.now()));
        }
        function clearWeatherCache() {
            try {
                LOCATIONS.forEach(loc => localStorage.removeItem(cacheKeyFor(loc)));
            } catch (e) {}
        }

        async function fetchForecast(location, skipCache = false) {
            const cacheKey = cacheKeyFor(location);
            const cachedItem = cacheGet(cacheKey);

            if (!skipCache && cachedItem) {
                try {
                    const parsed = JSON.parse(cachedItem);
                    if (parsed.expires && Date.now() < new Date(parsed.expires).getTime()) {
                        return { data: parsed.data, expires: parsed.expires };
                    }
                } catch (e) {
                    console.warn(`Feil ved lesing av cache for ${location.name}`, e);
                }
            }

            const url = `${API_BASE}?lat=${location.lat}&lon=${location.lon}`;
            const headers = {};
            if (!skipCache && cachedItem) {
                try {
                    const parsed = JSON.parse(cachedItem);
                    if (parsed.lastModified) {
                        headers['If-Modified-Since'] = parsed.lastModified;
                    }
                } catch (e) {}
            }

            try {
                const response = await fetch(url, { headers, cache: 'reload' });

                if (response.status === 304 && cachedItem) {
                    const parsed = JSON.parse(cachedItem);
                    parsed.expires = response.headers.get('Expires') || parsed.expires;
                    cacheSet(cacheKey, JSON.stringify(parsed));
                    return { data: parsed.data, expires: parsed.expires };
                }

                if (!response.ok) throw new Error(`Feil for ${location.name}: ${response.status}`);
                const data = await response.json();

                const expires = response.headers.get('Expires');
                const cacheEntry = {
                    data,
                    expires,
                    lastModified: response.headers.get('Last-Modified'),
                };
                cacheSet(cacheKey, JSON.stringify(cacheEntry));

                return { data, expires };
            } catch (err) {
                if (cachedItem) {
                    console.warn(`Bruker cache for ${location.name} pga nettverksfeil.`);
                    const parsed = JSON.parse(cachedItem);
                    return { data: parsed.data, expires: parsed.expires };
                }
                throw err;
            }
        }

        function msUntilNextForecast(updatedAt) {
            if (!updatedAt) return 15 * 60 * 1000;
            const nextForecast = new Date(updatedAt).getTime() + 65 * 60 * 1000;
            const delay = nextForecast - Date.now();
            return delay > 0 ? delay : 2 * 60 * 1000;
        }

        function getWeekendDays() {
            const days = [];
            const now = new Date();
            const dayOfWeek = now.getDay();
            const daysToSunday = (7 - dayOfWeek) % 7;
            const sunday = new Date(now);
            sunday.setDate(now.getDate() + daysToSunday);

            for (let offset = -2; offset <= 0; offset++) {
                const d = new Date(sunday);
                d.setDate(sunday.getDate() + offset);
                const dateStr = d.toISOString().split('T')[0];
                days.push({
                    dateStr,
                    dayName: DAY_NAMES[d.getDay()],
                    dayNum: d.getDate(),
                    month: d.getMonth() + 1,
                });
            }
            return days;
        }

        function aggregateDaily(timeseries, days) {
            const result = {};

            for (const day of days) {
                result[day.dateStr] = { temps: [], rainPeriods: [], symbol: null };
            }

            const daySet = new Set(days.map(d => d.dateStr));

            for (const entry of timeseries) {
                const dateStr = entry.time.split('T')[0];
                if (!daySet.has(dateStr)) continue;

                const bucket = result[dateStr];
                const hour = parseInt(entry.time.split('T')[1].split(':')[0], 10);

                if (entry.data.instant?.details?.air_temperature != null) {
                    bucket.temps.push(entry.data.instant.details.air_temperature);
                }

                if (hour >= 9 && hour < 22) {
                    if (entry.data.next_1_hours?.details?.precipitation_amount != null) {
                        const amt = entry.data.next_1_hours.details.precipitation_amount;
                        if (amt > 0) {
                            bucket.rainPeriods.push({ start: hour, end: hour + 1, amount: amt });
                        }
                    } else if (entry.data.next_6_hours?.details?.precipitation_amount != null && hour % 6 === 0) {
                        const amt = entry.data.next_6_hours.details.precipitation_amount;
                        if (amt > 0) {
                            const start = Math.max(hour, 9);
                            const end = Math.min(hour + 6, 22);
                            bucket.rainPeriods.push({ start, end, amount: amt * ((end - start) / 6) });
                        }
                    }
                }

                if (hour >= 10 && hour <= 14 && !bucket.symbol) {
                    const sym = entry.data.next_6_hours?.summary?.symbol_code
                             || entry.data.next_1_hours?.summary?.symbol_code;
                    if (sym) bucket.symbol = sym;
                }
            }

            for (const day of days) {
                const b = result[day.dateStr];
                b.rainPeriods.sort((a, c) => a.start - c.start);
                b.rainRanges = mergeRainPeriods(b.rainPeriods);
                if (!b.symbol) {
                    const fallback = timeseries.find(e =>
                        e.time.startsWith(day.dateStr) &&
                        (e.data.next_6_hours?.summary?.symbol_code || e.data.next_1_hours?.summary?.symbol_code)
                    );
                    if (fallback) {
                        b.symbol = fallback.data.next_6_hours?.summary?.symbol_code
                                || fallback.data.next_1_hours?.summary?.symbol_code;
                    }
                }
            }

            return result;
        }

        function mergeRainPeriods(periods) {
            if (periods.length === 0) return [];
            const ranges = [];
            let cur = { ...periods[0] };
            for (let i = 1; i < periods.length; i++) {
                const p = periods[i];
                if (p.start <= cur.end) {
                    cur.end = Math.max(cur.end, p.end);
                    cur.amount += p.amount;
                } else {
                    ranges.push(cur);
                    cur = { ...p };
                }
            }
            ranges.push(cur);
            return ranges;
        }

        function renderTable(allData, days) {
            const header = document.getElementById('table-header');
            header.innerHTML = '<th>Sted</th>';
            for (const day of days) {
                header.innerHTML += `<th><span class="day-name">${day.dayName}</span><span class="day-date">${day.dayNum}.${day.month}</span></th>`;
            }

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (allData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${days.length + 1}" style="text-align:center;color:#999;padding:2rem;">Ingen steder valgt. Bruk «⚙ Velg steder» for å legge til.</td></tr>`;
                return;
            }

            for (const { location, daily } of allData) {
                const row = document.createElement('tr');
                let cells = `<td>${location.name}</td>`;

                for (const day of days) {
                    const d = daily[day.dateStr];
                    if (!d || d.temps.length === 0) {
                        cells += '<td>—</td>';
                        continue;
                    }

                    const minTemp = Math.round(Math.min(...d.temps));
                    const maxTemp = Math.round(Math.max(...d.temps));
                    const symbol = d.symbol || 'cloudy';
                    const iconUrl = `${ICON_BASE}${symbol}.svg`;

                    let precipHtml;
                    if (d.rainRanges.length === 0) {
                        precipHtml = '<div class="precip dry">—</div>';
                    } else {
                        precipHtml = d.rainRanges.map(r => {
                            const amt = Math.round(r.amount * 10) / 10;
                            const pad = h => String(h).padStart(2, '0');
                            return `<div class="precip">${amt} mm kl. ${pad(r.start)}–${pad(r.end)}</div>`;
                        }).join('');
                    }

                    cells += `
                        <td>
                            <div class="weather-cell">
                                <img src="${iconUrl}" alt="${symbol}" loading="lazy">
                                <div class="temp">
                                    <span class="temp-min">${minTemp}°</span>
                                    <span class="temp-separator">/</span>
                                    <span class="temp-max">${maxTemp}°</span>
                                </div>
                                ${precipHtml}
                            </div>
                        </td>`;
                }

                row.innerHTML = cells;
                tbody.appendChild(row);
            }
        }

        async function loadForecast(skipCache = false) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const forecast = document.getElementById('forecast');
            const days = getWeekendDays();

            try {
                const results = await Promise.all(
                    LOCATIONS.map(async (loc) => {
                        const result = await fetchForecast(loc, skipCache);
                        const daily = aggregateDaily(result.data.properties.timeseries, days);
                        const updatedAt = result.data.properties?.meta?.updated_at;
                        return { location: loc, daily, updatedAt, expires: result.expires };
                    })
                );

                loading.style.display = 'none';
                error.style.display = 'none';
                forecast.style.display = 'block';
                renderTable(results, days);
                if (skipCache) markFetched();

                const pad = v => String(v).padStart(2, '0');

                const latestUpdate = results.map(r => r.updatedAt).filter(Boolean).sort().pop();

                if (latestUpdate) {
                    const d = new Date(latestUpdate);
                    document.getElementById('updated-current').textContent = `Prognose oppdatert kl. ${pad(d.getHours())}.${pad(d.getMinutes())}`;
                    const next = new Date(d.getTime() + 60 * 60 * 1000);
                    document.getElementById('updated-next').textContent = `Neste prognose ca. kl. ${pad(next.getHours())}.${pad(next.getMinutes())}`;
                }

                scheduleRefresh(latestUpdate);
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Kunne ikke hente værdata: ${err.message}`;
                scheduleRefresh(null);
            }
        }

        let refreshTimer = null;
        function scheduleRefresh(updatedAt) {
            if (refreshTimer) clearTimeout(refreshTimer);
            const delay = msUntilNextForecast(updatedAt);
            refreshTimer = setTimeout(() => loadForecast(false), delay);
        }

        // --- Place search & selection (Kartverket Stedsnavn) ---
        const GEO_API = 'https://ws.geonorge.no/stedsnavn/v1/navn';
        const round4 = n => Math.round(n * 10000) / 10000;

        function samePlace(a, b) {
            return round4(a.lat) === round4(b.lat) && round4(a.lon) === round4(b.lon);
        }

        async function searchPlaces(query) {
            const url = `${GEO_API}?sok=${encodeURIComponent(query)}*&utkoordsys=4258&treffPerSide=8&side=1`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Søk feilet: ${response.status}`);
            const data = await response.json();
            return (data.navn || []).map(n => ({
                name: n.skrivemåte,
                type: n.navneobjekttype || '',
                kommune: (n.kommuner && n.kommuner[0]) ? n.kommuner[0].kommunenavn : '',
                lat: round4(n.representasjonspunkt.nord),
                lon: round4(n.representasjonspunkt.øst),
            }));
        }

        function renderSearchResults(results) {
            const box = document.getElementById('search-results');
            if (results.length === 0) {
                box.innerHTML = '<div class="search-empty">Ingen treff</div>';
                box.classList.add('show');
                return;
            }
            box.innerHTML = results.map((r, i) => {
                const meta = [r.type, r.kommune].filter(Boolean).join(' · ');
                return `<div class="search-result" data-index="${i}">
                            <div class="sr-name">${r.name}</div>
                            <div class="sr-meta">${meta}</div>
                        </div>`;
            }).join('');
            box.classList.add('show');
            box.querySelectorAll('.search-result').forEach(el => {
                el.addEventListener('click', () => addPlace(results[parseInt(el.dataset.index, 10)]));
            });
        }

        function hideSearchResults() {
            const box = document.getElementById('search-results');
            box.classList.remove('show');
            box.innerHTML = '';
        }

        function addPlace(result) {
            const place = { name: result.name, lat: round4(result.lat), lon: round4(result.lon) };
            if (!LOCATIONS.some(p => samePlace(p, place))) {
                LOCATIONS.push(place);
                savePlaces(LOCATIONS);
                renderSelectedPlaces();
                loadForecast(false);
            }
            document.getElementById('place-search').value = '';
            hideSearchResults();
        }

        function removePlace(index) {
            LOCATIONS.splice(index, 1);
            savePlaces(LOCATIONS);
            renderSelectedPlaces();
            loadForecast(false);
        }

        function movePlace(index, delta) {
            const target = index + delta;
            if (target < 0 || target >= LOCATIONS.length) return;
            [LOCATIONS[index], LOCATIONS[target]] = [LOCATIONS[target], LOCATIONS[index]];
            savePlaces(LOCATIONS);
            renderSelectedPlaces();
            loadForecast(false);
        }

        function renderSelectedPlaces() {
            const container = document.getElementById('selected-places');
            if (LOCATIONS.length === 0) {
                container.innerHTML = '<div class="places-empty">Ingen steder valgt.</div>';
                return;
            }
            container.innerHTML = '';
            LOCATIONS.forEach((loc, i) => {
                const chip = document.createElement('span');
                chip.className = 'place-chip';

                const up = document.createElement('button');
                up.type = 'button';
                up.className = 'chip-move';
                up.textContent = '‹';
                up.setAttribute('aria-label', `Flytt ${loc.name} tidligere`);
                up.disabled = i === 0;
                up.addEventListener('click', () => movePlace(i, -1));

                const label = document.createElement('span');
                label.className = 'chip-label';
                label.textContent = loc.name;

                const down = document.createElement('button');
                down.type = 'button';
                down.className = 'chip-move';
                down.textContent = '›';
                down.setAttribute('aria-label', `Flytt ${loc.name} senere`);
                down.disabled = i === LOCATIONS.length - 1;
                down.addEventListener('click', () => movePlace(i, 1));

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'chip-remove';
                remove.textContent = '×';
                remove.setAttribute('aria-label', `Fjern ${loc.name}`);
                remove.addEventListener('click', () => removePlace(i));

                chip.appendChild(up);
                chip.appendChild(label);
                chip.appendChild(down);
                chip.appendChild(remove);
                container.appendChild(chip);
            });
        }

        function initPlacesUI() {
            const toggle = document.getElementById('places-toggle');
            const body = document.getElementById('places-body');
            toggle.addEventListener('click', () => {
                const open = body.style.display !== 'none';
                body.style.display = open ? 'none' : 'block';
                toggle.setAttribute('aria-expanded', String(!open));
            });

            const input = document.getElementById('place-search');
            let debounceTimer = null;
            input.addEventListener('input', () => {
                const q = input.value.trim();
                clearTimeout(debounceTimer);
                if (q.length < 2) { hideSearchResults(); return; }
                debounceTimer = setTimeout(async () => {
                    try {
                        renderSearchResults(await searchPlaces(q));
                    } catch (e) {
                        console.warn('Stedssøk feilet', e);
                    }
                }, 300);
            });

            // Close the dropdown when clicking outside the search box.
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.places-search')) hideSearchResults();
            });

            renderSelectedPlaces();
        }

        initPlacesUI();

        if (lastFetchAge() < MIN_FETCH_INTERVAL_MS) {
            loadForecast(false);
        } else {
            clearWeatherCache();
            loadForecast(true);
        }
    </script>
</body>
</html>
